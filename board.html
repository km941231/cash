'use strict';

(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = saved === 'dark' ? '☀ 라이트' : '🌙 다크';
})();
function toggleMenu() {
  const links = document.querySelector('.nav-links');
  links.classList.toggle('open');
  document.getElementById('menu-btn').textContent = links.classList.contains('open') ? '✕' : '☰';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀ 라이트' : '🌙 다크';
}

      </ul>
      <h4>틸트 관리</h4>
      <p>뱅크롤 관리와 함께 감정 관리(틸트 컨트롤)가 중요합니다. 큰 팟을 잃었거나 연속으로 지는 상황에서 스테이크를 올리거나 무리한 플레이를 하면 뱅크롤이 빠르게 소진됩니다.</p>
      <ul>
        <li>일일 손실 한도 설정 (예: 3 바이인 이상 잃으면 중단)</li>
        <li>세션 시간 제한 (집중력 유지)</li>
        <li>틸트 신호 파악: 손이 빨라지거나 평소와 다른 플레이가 나올 때</li>
      </ul>
      <div class="tip"><strong>황금 원칙:</strong> 한 세션에 뱅크롤의 5% 이상을 잃었다면 쉬세요. 장기적인 수익은 많이 이기는 것보다 큰 손실을 피하는 데서 나옵니다.</div>
      <a href="game.html" class="post-tool-link">🎮 멘탈 관리하며 핸드 연습하기</a>
    `
  }
];

let activeCat = '전체';
let openId = null;

function filterPosts(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.textContent.trim() === cat || (cat === '전체' && t.textContent.trim() === '전체'));
  });
  openId = null;
  renderPosts();
}

function togglePost(id) {
  openId = openId === id ? null : id;
  renderPosts();
}

function renderPosts() {
  const list = document.getElementById('board-list');
  const filtered = activeCat === '전체' ? POSTS : POSTS.filter(p => p.category === activeCat);

  if (!filtered.length) {
    list.innerHTML = '<div class="board-empty">해당 카테고리의 글이 없습니다.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    const isOpen = openId === p.id;
    return `
      <article class="post-card" id="post-${p.id}">
        <div class="post-head" onclick="togglePost(${p.id})">
          <div class="post-meta">
            <span class="post-num">#${p.id}</span>
            <span class="post-cat ${p.category}">${p.category}</span>
            <span class="post-date">${p.date}</span>
          </div>
          <div class="post-title">${p.title}</div>
          <div class="post-preview">${p.preview}</div>
        </div>
        <div class="post-footer">
          <button class="post-toggle ${isOpen ? 'open' : ''}" onclick="togglePost(${p.id})">
            ${isOpen ? '접기' : '자세히 보기'} <span class="arr">▼</span>
          </button>
        </div>
        <div class="post-body ${isOpen ? 'open' : ''}">
          <div class="post-body-inner">${p.content}</div>
        </div>
      </article>
    `;
  }).join('');
}

renderPosts();
</script>
</body>
</html>
